[package]
name = "stock-overlay"
version = "0.1.0"
description = "Windows A-share quote overlay"
authors = ["StockOverlay contributors"]
edition = "2021"

[lib]
name = "stock_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["blocking"] }
encoding_rs = "0.8"
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
